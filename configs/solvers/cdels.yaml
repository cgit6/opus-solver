solver_id: cdels
solver_class: CDELSSolver
capabilities:
  problem_types: [scvrp]
  encodings: [scvrp_route_transfer]
  directions: [min]
stop_condition:
  type: max_iterations
  # Generation 1 是初始族群；11,220 次 transition 對應最終 generation 11,221。
  max_iterations: 11220
params:
  - compatibility_profile: vs2019_v142_archive
    de_technique: rand_1_exp
    termination_mode: fixed_iterations
    start_temperature: 1.0
    cooling_rate: 0.95
    iterations_per_temperature: 110
